name: Build SkyrimPlatform 1.7.104

on:
  workflow_dispatch:

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Prepare vcpkg cache
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: aventurarp-vcpkg-${{ runner.os }}-${{ hashFiles('overlay_ports/**', 'VERSIONS.lock.txt') }}
          restore-keys: |
            aventurarp-vcpkg-${{ runner.os }}-

      - name: Checkout SkyMP
        shell: powershell
        run: |
          git clone --recursive https://github.com/skyrim-multiplayer/skymp.git skymp
          cd skymp
          git checkout f926944b18e3aed4bc3864ce668626c05ec2545f
          git submodule update --init --recursive

      - name: Apply Aventura RP CommonLib 7.5.4 port
        shell: powershell
        run: |
          .\apply_port.ps1 -SkyMP "$pwd\skymp"

      - name: Prepare Yarn
        shell: powershell
        run: |
          corepack enable
          yarn --version

      - name: Configure
        shell: powershell
        run: |
          cmake -S "$pwd\skymp" -B "$pwd\skymp\build" -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_UNIT_TESTS=OFF `
            -DBUILD_GAMEMODE=OFF `
            -DBUILD_FRONT=OFF `
            -DBUILD_CLIENT=ON `
            -DBUILD_SKYRIM_PLATFORM=ON `
            -DBUILD_SCRIPTS=OFF `
            -DINSTALL_CLIENT_DIST=OFF `
            -DGENERATE_CLIENT_SETTINGS=ON `
            -DPREPARE_NEXUS_ARCHIVES=OFF `
            -DOFFLINE_MODE=ON

      - name: Save vcpkg cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: aventurarp-vcpkg-${{ runner.os }}-${{ hashFiles('overlay_ports/**', 'VERSIONS.lock.txt') }}

      - name: Build
        shell: powershell
        run: |
          cmake --build "$pwd\skymp\build" `
            --config Release `
            --target skyrim-platform skymp5-client `
            -- /m

      - name: Collect diagnostics
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=== SkyrimPlatform binaries ==="
          Get-ChildItem `
            -Path "$pwd\skymp\build" `
            -Recurse `
            -Include SkyrimPlatform.dll,SkyrimPlatformImpl.dll,SkyrimPlatformCEF.exe.hidden,MpClientPlugin.dll `
            -ErrorAction SilentlyContinue |
            Select-Object FullName,Length |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "=== SkyMP client ==="

          $clientJs = Join-Path `
            "$pwd\skymp\build\dist\client" `
            "Data\Platform\Plugins\skymp5-client.js"

          $clientSettings = Join-Path `
            "$pwd\skymp\build\dist\client" `
            "Data\Platform\Plugins\skymp5-client-settings.txt"

          if (Test-Path $clientJs) {
            Write-Host "OK: skymp5-client.js encontrado."
            Get-Item $clientJs |
              Select-Object FullName,Length |
              Format-Table -AutoSize
          }
          else {
            Write-Host "ERRO: skymp5-client.js nao foi gerado."
          }

          if (Test-Path $clientSettings) {
            Write-Host "OK: skymp5-client-settings.txt encontrado."
          }
          else {
            Write-Host "AVISO: skymp5-client-settings.txt nao foi gerado."
          }

      - name: Validate complete client core
        shell: powershell
        run: |
          $root = "$pwd\skymp\build\dist\client"

          $required = @(
            "Data\SKSE\Plugins\SkyrimPlatform.dll",
            "Data\SKSE\Plugins\MpClientPlugin.dll",
            "Data\Platform\Distribution\RuntimeDependencies\SkyrimPlatformImpl.dll",
            "Data\Platform\Distribution\RuntimeDependencies\SkyrimPlatformCEF.exe.hidden",
            "Data\Platform\Plugins\skymp5-client.js",
            "Data\Scripts\TESModPlatform.pex"
          )

          $missing = @()

          foreach ($relative in $required) {
            $full = Join-Path $root $relative

            if (Test-Path $full) {
              Write-Host "OK  $relative"
            }
            else {
              Write-Host "FALTA  $relative"
              $missing += $relative
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Client Core incompleto. Faltam $($missing.Count) arquivo(s)."
            exit 1
          }

          Write-Host ""
          Write-Host "Aventura RP Client Core completo."

      - name: Upload client core
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AventuraRP-ClientCore-1.7.104
          path: skymp/build/dist/client
          if-no-files-found: error
